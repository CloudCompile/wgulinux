<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>wgulinux | Linux in the browser</title>
  <link rel="stylesheet" href="./src/ui.css">
  <script src="./coi-serviceworker.js"></script>
  <script src="./public/v86/build/libv86.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="masthead">
      <div>
        <p class="kicker">real x86 Linux / v86</p>
        <h1>wgulinux</h1>
        <p class="lede">A real Linux kernel and BusyBox shell running entirely in this browser tab.</p>
      </div>
      <div class="status-chip" id="boot-state">stopped</div>
    </header>

    <section class="workspace boot-workspace" aria-label="Linux virtual machine">
      <section class="console-panel panel">
        <div class="panel-heading">
          <div><p class="eyebrow">serial console</p><h2>guest ttyS0</h2></div>
          <span class="signal">v86 x86</span>
        </div>
        <div class="terminal" id="terminal" tabindex="0" role="textbox" aria-label="Linux guest terminal"></div>
        <div class="console-actions">
          <button class="button button-primary" id="boot-button" type="button">Start guest</button>
          <button class="button" id="save-button" type="button">Save</button>
          <button class="button" id="gpu-button" type="button">Run GPU demo</button>
          <button class="button button-danger" id="reset-button" type="button">Reset disk</button>
          <span class="muted" id="snapshot-size">snapshot: 0 B</span>
        </div>
      </section>
    </section>

    <footer><span>static client / Linux guest</span><span>image: linux4.iso</span></footer>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
